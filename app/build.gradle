plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.8.22'
}

android {
    namespace 'com.widge.cctv.tuya'
    compileSdk 34

    defaultConfig {
        applicationId "com.widge.cctv.tuya"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "4.0-tv-launcher-cctv"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // Force all Kotlin stdlib artifacts to the same version to avoid duplicate class conflicts
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') {
            because 'Align Kotlin stdlib versions to prevent duplicate classes'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'Align Kotlin stdlib-jdk7 versions to prevent duplicate classes'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'Align Kotlin stdlib-jdk8 versions to prevent duplicate classes'
        }
    }
}